# Évite la mise en pause du projet Supabase gratuit après 7 jours sans activité.
# Ajoutez les secrets SUPABASE_URL et SUPABASE_KEY dans GitHub > Settings > Secrets and variables > Actions.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 9 */3 * *'   # tous les 3 jours
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lire un lieu
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/places?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" -o /dev/null
